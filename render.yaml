# Render Blueprint. One Docker web service serves the API and the built frontend.
# Deploys are triggered by GitHub Actions on green `main` (autoDeploy is off on purpose).
services:
  - type: web
    name: vouch
    runtime: docker
    plan: starter
    region: virginia
    autoDeploy: false
    healthCheckPath: /api/healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_DEMO_USER_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
