<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOUCH</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply a stored theme before first paint so there is no light flash. Mirrors lib/theme.ts.
      try {
        var vouchTheme = localStorage.getItem('vouch.theme');
        if (vouchTheme === 'dark' || vouchTheme === 'light') {
          document.documentElement.setAttribute('data-theme', vouchTheme);
        }
      } catch (e) {
        /* storage unavailable: follow the OS preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
