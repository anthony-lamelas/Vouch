# Local full stack: `docker compose up --build`, then open http://localhost:8000
# Works on Linux, macOS and Windows (Docker Desktop). Auth is disabled in this mode.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch
      POSTGRES_DB: vouch
    ports:
      - "5432:5432"
    volumes:
      - vouch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      AUTH_DISABLED: "true"
      DATABASE_URL: postgresql+psycopg://vouch:vouch@db:5432/vouch
      APP_BASE_URL: http://localhost:8000
      ADMIN_TOKEN: local-admin
      SEED_ON_START: "true"
    ports:
      - "8000:8000"

volumes:
  vouch_pgdata:
